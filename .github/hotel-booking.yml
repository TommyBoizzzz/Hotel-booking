name: Hotel Booking CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Spring Boot
        working-directory: backend
        run: mvn clean package -DskipTests


  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build React
        working-directory: frontend
        run: npm run build


  notify:
  if: always()
  needs: [build-backend, build-frontend]
  runs-on: ubuntu-latest

  steps:
    - name: Send Telegram Alert (Git Alert Topic)
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d "chat_id=-1003923199516" \
        -d "message_thread_id=4" \
        -d "text=🚀 HOTEL BOOKING CI/CD RESULT%0A%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0AStatus: DONE%0ACommit: ${{ github.event.head_commit.message }}"